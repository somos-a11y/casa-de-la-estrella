<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Casa de la Estrella · Cultura y Comunidad</title>
<meta name="description" content="Casa de la Estrella. Cultura y comunidad. Estamos construyendo nuestro hogar para la cultura y la comunidad." />

<!-- ============================================================= -->
<!--  CÓMO PONER TU FOTO (la estrella o la puerta de la casa):     -->
<!--  1. Guarda tu imagen en la MISMA carpeta que este index.html. -->
<!--  2. Nómbrala  estrella.jpg  (o cambia el src de abajo).        -->
<!--  Si no hay foto, se muestra una estrella en ocre.             -->
<!-- ============================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Libre+Franklin:wght@400;500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    /* paleta oficial Casa de la Estrella */
    --ocre:        #D4A833;   /* protagonista · casa y flores · título/acento */
    --azul:        #2C4A6A;   /* azul pizarra · estructura */
    --azul-hondo:  #213a54;   /* sombra del azul, mismo matiz */
    --vino:        #6C2A3A;   /* reemplazo de terracota · líneas y detalles */
    --verde-gris:  #575E52;   /* acento neutro · fondos sutiles */
    --hueso:       #F4EFE5;   /* blanco hueso · texto sobre azul */
    --hueso-tenue: rgba(244,239,229,.62);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    /* fondo azul pizarra con profundidad, mismo matiz de marca */
    background:
      radial-gradient(1100px 650px at 50% -8%, rgba(212,168,51,.10), transparent 60%),
      radial-gradient(800px 520px at 82% 112%, rgba(108,42,58,.22), transparent 55%),
      linear-gradient(165deg, var(--azul) 0%, var(--azul-hondo) 100%);
    color:var(--hueso);
    font-family:'Atkinson Hyperlegible', system-ui, sans-serif;
    font-size:16px;                 /* mínimo digital del manual */
    line-height:1.6;
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;padding:2rem;
  }

  /* campo de estrellas (blanco sobre azul) */
  .estrellas{position:fixed;inset:0;pointer-events:none;z-index:0}
  .estrellas span{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:var(--hueso);opacity:0;
    animation:titilar 5s ease-in-out infinite;
  }
  @keyframes titilar{0%,100%{opacity:.08;transform:scale(1)}50%{opacity:.7;transform:scale(1.6)}}

  .grano{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .marco{
    position:relative;z-index:2;width:100%;max-width:560px;text-align:center;
    animation:entrar 1.1s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes entrar{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  /* retrato / foto, aro en ocre (casa y flores) con detalle vino */
  .retrato{
    position:relative;width:226px;height:226px;margin:0 auto 2.4rem;
    border-radius:50%;padding:9px;
    background:conic-gradient(from 210deg, var(--ocre), var(--vino), var(--ocre), var(--ocre));
    box-shadow:0 0 0 1px rgba(244,239,229,.08), 0 28px 64px -24px rgba(0,0,0,.6), 0 0 80px -22px rgba(212,168,51,.4);
    animation:flotar 7s ease-in-out infinite;
  }
  @keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .retrato-inner{
    width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;
    background:radial-gradient(circle at 50% 35%, #2f4f72, var(--azul-hondo));
    display:flex;align-items:center;justify-content:center;
  }
  .retrato-inner img{width:100%;height:100%;object-fit:cover;display:block}

  .estrella-fallback{display:flex;flex-direction:column;align-items:center;gap:.55rem;color:var(--ocre)}
  .estrella-fallback svg{width:84px;height:84px;filter:drop-shadow(0 0 16px rgba(212,168,51,.5))}
  .estrella-fallback small{
    font-family:'Libre Franklin',sans-serif;font-weight:500;
    font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--hueso-tenue);
  }

  /* kicker en Libre Franklin (etiqueta) */
  .kicker{
    font-family:'Libre Franklin',sans-serif;font-weight:500;
    font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--hueso-tenue);margin-bottom:1.1rem;
  }

  /* nombre en Grand Hotel, ocre, título de alto impacto */
  h1{
    font-family:'Grand Hotel', cursive;font-weight:400;
    color:var(--ocre);
    font-size:clamp(3.2rem, 11vw, 5.4rem);
    line-height:.95;letter-spacing:.5px;margin-bottom:1rem;
    text-shadow:0 2px 30px rgba(212,168,51,.25);
  }

  /* tagline: Libre Franklin, mayúscula espaciada, ocre, punto medio */
  .tagline{
    font-family:'Libre Franklin',sans-serif;font-weight:600;
    color:var(--ocre);
    font-size:.86rem;letter-spacing:.4em;text-transform:uppercase;
    margin-bottom:2.2rem;
  }

  /* línea divisoria con detalle vino → ocre → vino */
  .linea{
    width:64px;height:2px;margin:0 auto 2rem;border-radius:2px;
    background:linear-gradient(90deg, var(--vino), var(--ocre), var(--vino));
  }

  .mensaje{
    font-size:1.05rem;line-height:1.72;max-width:430px;margin:0 auto 2.6rem;
    color:var(--hueso);
  }
  .mensaje .destacado{font-weight:700;color:var(--ocre)}

  .contacto{
    display:inline-flex;align-items:center;gap:.6rem;
    font-family:'Libre Franklin',sans-serif;font-weight:500;
    font-size:1rem;color:var(--hueso);text-decoration:none;
    padding:.85rem 1.6rem;border-radius:999px;
    border:1.5px solid rgba(212,168,51,.5);
    background:rgba(212,168,51,.07);
    transition:all .35s ease;
  }
  .contacto:hover,.contacto:focus-visible{
    border-color:var(--ocre);background:rgba(212,168,51,.16);
    transform:translateY(-2px);outline:none;
    box-shadow:0 14px 38px -18px rgba(212,168,51,.6);
  }
  .contacto:focus-visible{outline:2px solid var(--ocre);outline-offset:3px}
  .contacto svg{width:18px;height:18px;color:var(--ocre)}

  footer{
    position:fixed;bottom:1.4rem;left:0;right:0;z-index:2;text-align:center;
    font-family:'Libre Franklin',sans-serif;font-weight:400;
    font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;
    color:rgba(244,239,229,.34);
  }

  @media(max-width:480px){
    .retrato{width:178px;height:178px}
    .tagline{letter-spacing:.3em}
  }
</style>
</head>
<body>

  <div class="estrellas" id="estrellas" aria-hidden="true"></div>
  <div class="grano" aria-hidden="true"></div>

  <main class="marco">

    <div class="retrato">
      <div class="retrato-inner">
        <!-- TU FOTO: cambia "estrella.jpg" por el nombre de tu imagen -->
        <img id="foto" src="estrella.jpg" alt="La estrella de Casa de la Estrella"
             onerror="this.style.display='none';document.getElementById('fallback').style.display='flex';" />
        <div class="estrella-fallback" id="fallback" style="display:none" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.6L21.5 9l-5.2 4.3 1.7 6.7L12 16.8 6 20l1.7-6.7L2.5 9l6.9-.4L12 2z"/></svg>
          <small>tu estrella aquí</small>
        </div>
      </div>
    </div>

    <p class="kicker">Próximamente</p>

    <h1>Casa de la Estrella</h1>
    <p class="tagline">Cultura&nbsp;&middot;&nbsp;Comunidad</p>

    <div class="linea" aria-hidden="true"></div>

    <p class="mensaje">
      Estamos abriendo las puertas de un nuevo hogar para la cultura y la comunidad.
      Pronto este será un espacio para <span class="destacado">encontrarnos, crear y compartir</span>.
    </p>

    <a class="contacto" href="mailto:comunidad@casadelaestrella.org">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      comunidad@casadelaestrella.org
    </a>

  </main>

  <footer>Casa de la Estrella &middot; Costa Rica</footer>

  <script>
    var cielo = document.getElementById('estrellas');
    for (var i = 0; i < 60; i++){
      var s = document.createElement('span');
      s.style.left = (Math.random()*100) + '%';
      s.style.top  = (Math.random()*100) + '%';
      s.style.animationDelay = (Math.random()*5) + 's';
      s.style.animationDuration = (3 + Math.random()*4) + 's';
      cielo.appendChild(s);
    }
  </script>

</body>
</html>
